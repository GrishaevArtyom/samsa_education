services:
  app:
    build:
      context: ../backend
    container_name: edu_ai_app
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: edu_ai_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: edu_ai_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus